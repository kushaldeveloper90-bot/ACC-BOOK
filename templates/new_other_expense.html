{% extends 'base.html' %}
{% block title %}Record Other Expense{% endblock %}
{% block page_title %}Record Other Expense{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <form method="POST" action="{% if expense %}{{ url_for('edit_other_expense', exp_id=expense['id']) }}{% else %}{{ url_for('new_other_expense') }}{% endif %}">
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" name="exp_date" value="{{ expense['exp_date'] if expense else today }}" required>
      </div>
      
      <div class="form-group">
        <label>Category</label>
        <select name="category" required>
          <option {% if expense and expense['category'] == 'Travel / Transportation' %}selected{% endif %}>Travel / Transportation</option>
          <option {% if expense and expense['category'] == 'Meals / Entertainment' %}selected{% endif %}>Meals / Entertainment</option>
          <option {% if expense and expense['category'] == 'Supplies / Materials' %}selected{% endif %}>Supplies / Materials</option>
          <option {% if expense and expense['category'] == 'Repairs / Maintenance' %}selected{% endif %}>Repairs / Maintenance</option>
          <option {% if expense and expense['category'] == 'Miscellaneous Expense' %}selected{% endif %}>Miscellaneous Expense</option>
        </select>
      </div>

      <div class="form-group" style="grid-column: 1 / -1;">
        <label>Payee / Vendor (Optional)</label>
        <input type="text" name="payee" value="{{ expense['payee'] if expense else '' }}" placeholder="Where did this expense go to?">
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" name="amount" min="0" step="any" required value="{{ expense['amount'] if expense else '' }}" placeholder="0.00">
      </div>

      <div class="form-group" style="grid-column: 1 / -1;">
        <label>Description</label>
        <input type="text" name="description" value="{{ expense['description'] if expense else '' }}" placeholder="Brief detail about the expense">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select name="status" id="statusSelect" required>
          <option value="Paid" {% if expense and expense['status'] == 'Paid' %}selected{% endif %}>Paid</option>
          <option value="Payable" {% if expense and expense['status'] == 'Payable' %}selected{% endif %}>Payable</option>
        </select>
      </div>

      <div class="form-group" id="paymentModeDiv">
        <label>Payment Mode</label>
        <select name="payment_mode" onchange="toggleBankSource(this, 'expenseBankSourceDiv')">
          <option value="Cash" {% if expense and expense['payment_mode'] == 'Cash' %}selected{% endif %}>Cash</option>
          <option value="Bank" {% if expense and expense['payment_mode'] and expense['payment_mode'].startswith('Bank') %}selected{% endif %}>Bank</option>
        </select>
      </div>
      
      <div class="form-group" id="expenseBankSourceDiv" style="display: none;">
        <label>Bank Source</label>
        <select name="bank_source">
          <option value="Cheque" {% if expense and expense['payment_mode'] and 'Cheque' in expense['payment_mode'] %}selected{% endif %}>Cheque</option>
          <option value="Bank Transfer" {% if expense and expense['payment_mode'] and 'Bank Transfer' in expense['payment_mode'] %}selected{% endif %}>Bank Transfer</option>
          <option value="UPI" {% if expense and expense['payment_mode'] and 'UPI' in expense['payment_mode'] %}selected{% endif %}>UPI</option>
        </select>
      </div>
    </div>

    <!-- Hidden input to redirect back to dashboard if submitted from there -->
    <input type="hidden" name="from_dashboard" value="{{ request.args.get('from_dashboard', '') }}">

    <div style="margin-top: 24px; display: flex; gap: 10px;">
      <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save Expense</button>
      <a href="javascript:history.back()" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
    </div>
  </form>
</div>

<script>
function togglePaymentMode() {
  const status = document.getElementById('statusSelect').value;
  const modeDiv = document.getElementById('paymentModeDiv');
  if (status === 'Payable') {
    modeDiv.style.display = 'none';
  } else {
    modeDiv.style.display = 'block';
  }
}
document.getElementById('statusSelect').addEventListener('change', togglePaymentMode);

function initBankSource() {
  const select = document.querySelector('select[name="payment_mode"]');
  const div = document.getElementById('expenseBankSourceDiv');
  if (select && select.value === 'Bank') {
    div.style.display = 'block';
  }
}

// Run on load
document.addEventListener('DOMContentLoaded', function() {
  togglePaymentMode();
  initBankSource();
});
</script>
{% endblock %}
